<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام STPS الذكي</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="toast-container"></div>
    <div class="sidebar">
        <h2>نظام STPS 📦</h2>
        <div class="nav-item">🏠 الرئيسية</div>
        <div class="nav-item" onclick="showNotification('تم فتح قائمة الطلبات')">📄 الطلبات</div>
        <div class="nav-item">👥 الموردون</div>
    </div>
    <div class="main">
        <div class="card">
            <h1>مرحباً، نورة القطان 👤</h1>
            <div class="chat-box" id="chatDisplay">
                <div class="msg ai">مرحباً! كيف يمكنني مساعدتك؟</div>
            </div>
            <div class="quick-hints">
                <button class="hint-btn" onclick="autoChat('ما حالة المعاملة؟')">ما حالة المعاملة؟</button>
            </div>
            <div class="input-group">
                <input type="text" id="userInput" placeholder="اكتبي هنا...">
                <button onclick="manualChat()">إرسال</button>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
